<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qwen-stream live</title>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #999; --panel: #1c1c1c; --accent: #7cc4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; max-width: 1100px; }
  figure { margin: 0; }
  figcaption { color: var(--muted); margin-bottom: 4px; }
  video, img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--panel); border-radius: 6px; transform: scaleX(-1); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; max-width: 1100px; }
  input[type=text] { flex: 1 1 320px; padding: 8px; background: var(--panel); color: var(--fg); border: 1px solid #333; border-radius: 6px; }
  select, button { padding: 8px; background: var(--panel); color: var(--fg); border: 1px solid #333; border-radius: 6px; }
  label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; max-width: 1100px; }
  .stat { background: var(--panel); border-radius: 6px; padding: 8px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--accent); }
  .stat span { color: var(--muted); font-size: 12px; }
  #status { color: var(--muted); margin-top: 8px; }
  .output { position: relative; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div class="views">
  <figure><figcaption>Camera</figcaption><video id="video" autoplay playsinline muted></video></figure>
  <figure><figcaption>Qwen-Image 2.1 stream</figcaption>
    <div class="output"><img id="output" alt=""><canvas id="overlay"></canvas></div></figure>
</div>

<div class="controls">
  <select id="mode" title="edit: the frame is the condition image (D13); img2img: the frame is noised (D4)">
    <option value="edit" selected>edit (instruction)</option>
    <option value="img2img">img2img (description)</option>
  </select>
  <input id="prompt" type="text">
  <button id="apply">Apply prompt</button>
  <select id="schedule"></select>
  <label><input id="filter" type="checkbox"> skip similar frames</label>
  <label title="limit the edit to where you look (GAZE.md)"><input id="gaze" type="checkbox"> gaze focus</label>
  <select id="radius" title="focus radius, as a fraction of the image">
    <option value="0.2">small focus</option><option value="0.3" selected>medium focus</option><option value="0.4">large focus</option>
  </select>
  <button id="calibrate">calibrate gaze</button>
</div>

<div class="stats">
  <div class="stat"><b id="fps">-</b><span>output FPS (browser)</span></div>
  <div class="stat"><b id="gpu">-</b><span>GPU ms / frame</span></div>
  <div class="stat"><b id="latency">-</b><span>camera-to-screen ms</span></div>
  <div class="stat"><b id="denoise">-</b><span>denoise ms</span></div>
  <div class="stat"><b id="vae">-</b><span>tiny VAE enc+dec ms</span></div>
  <div class="stat"><b id="jpeg">-</b><span>JPEG enc+dec ms</span></div>
</div>
<div id="status">connecting...</div>

<script type="module">
import { GazeModel, OneEuro, Fixation, pursuitTarget, startFaceTracking } from "./gaze.js";
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token");
const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?token=${token}`);
ws.binaryType = "blob";
const canvas = document.createElement("canvas");
const sentAt = [];             // send times of frames in flight, oldest first
const MAX_IN_FLIGHT = 2;       // hides network round trip; the server keeps at most one frame waiting
let size = 512, outputTimes = [], lastStats = null, previousUrl = null;

const avg = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
const recent = { gpu: [], latency: [], denoise: [], vae: [], jpeg: [] };
function track(key, value) { const xs = recent[key]; xs.push(value); if (xs.length > 20) xs.shift(); $(key).textContent = avg(xs).toFixed(0); }

function sendFrame() {
  const video = $("video");
  if (ws.readyState !== WebSocket.OPEN || !video.videoWidth || sentAt.length >= MAX_IN_FLIGHT) return;
  const side = Math.min(video.videoWidth, video.videoHeight);  // center crop to a square
  canvas.getContext("2d").drawImage(video, (video.videoWidth - side) / 2, (video.videoHeight - side) / 2, side, side, 0, 0, size, size);
  sentAt.push(performance.now());
  canvas.toBlob((blob) => ws.send(blob), "image/jpeg", 0.85);
}

ws.onmessage = (event) => {
  if (typeof event.data === "string") {
    const message = JSON.parse(event.data);
    if (message.size) {
      size = canvas.width = canvas.height = message.size;
      // the server keeps its state across connections, so sync it to what this page shows
      configure(settings());
      $("status").textContent = "streaming"; sendFrame(); sendFrame();
    }
    else if (message.configured) $("status").textContent = `applied: ${message.configured.join(", ")}`;
    else lastStats = message;
    return;
  }
  const now = performance.now();
  track("latency", now - sentAt.shift());
  outputTimes.push(now); outputTimes = outputTimes.filter((t) => now - t < 2000);
  $("fps").textContent = (outputTimes.length / 2).toFixed(1);
  if (lastStats && lastStats.prompt) $("status").textContent = `prompt applied in ${(lastStats.prompt / 1000).toFixed(1)} s`;
  if (lastStats && !lastStats.skipped) {
    track("denoise", lastStats.denoise);
    track("vae", lastStats.encode + lastStats.decode);
    track("jpeg", lastStats.jpeg);
    track("gpu", lastStats.encode + lastStats.denoise + lastStats.decode + lastStats.jpeg);
  }
  if (previousUrl) URL.revokeObjectURL(previousUrl);
  $("output").src = previousUrl = URL.createObjectURL(event.data);
  sendFrame();
};
ws.onclose = (event) => { $("status").textContent = `disconnected ${event.reason || ""}`; };

const configure = (settings) => ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify(settings));
const MODES = {
  edit: { prompt: "Turn this photo into a watercolor painting with soft pastel colors and visible paper texture.",
          schedules: [["edit-3", "3 steps (fastest)"], ["edit-4", "4 steps"], ["edit-6", "6 steps (best)"]] },
  img2img: { prompt: "a watercolor painting, soft pastel colors, paper texture",
             schedules: [["img2img-subtle", "subtle (2 steps)"], ["img2img-medium", "medium (3 steps)"], ["img2img-strong", "strong (4 steps)"]] },
};
function setMode(mode) {
  const previous = MODES[mode === "edit" ? "img2img" : "edit"];
  if (!$("prompt").value || $("prompt").value === previous.prompt) $("prompt").value = MODES[mode].prompt;
  $("schedule").innerHTML = MODES[mode].schedules.map(([v, label]) => `<option value="${v}">${label}</option>`).join("");
}
setMode("edit");
const settings = () => ({ mode: $("mode").value, prompt: $("prompt").value, schedule: $("schedule").value,
                          filter: $("filter").checked, focus: null });
$("apply").onclick = () => { $("status").textContent = "encoding prompt..."; configure({ prompt: $("prompt").value }); };
$("prompt").onkeydown = (event) => { if (event.key === "Enter") $("apply").click(); };  // returning false would swallow keys
$("mode").onchange = () => { setMode($("mode").value); $("status").textContent = "encoding prompt..."; configure(settings()); };
$("schedule").onchange = () => configure({ schedule: $("schedule").value });
$("filter").onchange = () => configure({ filter: $("filter").checked });

// Gaze focus (GAZE.md): MediaPipe face landmarks -> calibrated (u, v) on the output -> focus on fixation.
const CALIBRATION_SECONDS = 12, SETTLE_SECONDS = 1;
const gaze = { tracker: null, model: null, calibrationStart: null, samples: [], filters: [new OneEuro(), new OneEuro()],
               fixation: new Fixation(), sent: null, sentAt: 0 };

function drawOverlay(point, ring) {
  const c = $("overlay"), ctx = c.getContext("2d");
  c.width = c.clientWidth; c.height = c.clientHeight;
  if (!point) return;
  const [x, y] = [point[0] * c.width, point[1] * c.height];
  ctx.strokeStyle = ctx.fillStyle = "#7cc4ff";
  ctx.beginPath(); ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.fill();
  if (ring) { ctx.beginPath(); ctx.arc(x, y, ring * c.width, 0, 2 * Math.PI); ctx.stroke(); }
}

function onFace(features, t) {
  if (gaze.calibrationStart !== null) {  // smooth pursuit: follow the dot
    if (gaze.calibrationStart === undefined) gaze.calibrationStart = t;
    const elapsed = t - gaze.calibrationStart, target = pursuitTarget(elapsed);
    drawOverlay(target);
    if (elapsed > SETTLE_SECONDS) gaze.samples.push([features, target]);
    if (elapsed > CALIBRATION_SECONDS) {
      gaze.model = new GazeModel().fit(gaze.samples.map((s) => s[0]), gaze.samples.map((s) => s[1]));
      gaze.calibrationStart = null; drawOverlay(null);
      $("status").textContent = `gaze calibrated on ${gaze.samples.length} samples`;
    }
    return;
  }
  if (!gaze.model || !$("gaze").checked) return;
  const raw = gaze.model.predict(features).map((x) => Math.min(1, Math.max(0, x)));
  const point = raw.map((x, i) => gaze.filters[i].filter(x, t));
  const fixated = gaze.fixation.update(point, t), radius = Number($("radius").value);
  drawOverlay(point, fixated ? radius : 0);
  const moved = !gaze.sent || Math.hypot(point[0] - gaze.sent[0], point[1] - gaze.sent[1]) > 0.03;
  if (fixated && moved && t - gaze.sentAt > 0.1) {
    // The output is shown mirrored, so screen u maps to image 1 - u.
    configure({ focus: { u: 1 - point[0], v: point[1], radius } });
    gaze.sent = point; gaze.sentAt = t;
  }
}

async function startCalibration() {
  $("status").textContent = "loading face tracker...";
  gaze.tracker ??= await startFaceTracking($("video"), onFace);
  $("status").textContent = `calibrating: follow the dot with your eyes for ${CALIBRATION_SECONDS} s`;
  gaze.samples = []; gaze.calibrationStart = undefined;  // set on the first tracked frame
}
$("calibrate").onclick = startCalibration;
$("gaze").onchange = () => {
  if ($("gaze").checked && !gaze.model) startCalibration();
  if (!$("gaze").checked) { configure({ focus: null }); gaze.sent = null; drawOverlay(null); }
};
$("radius").onchange = () => { gaze.sent = null; };  // resend with the new radius on the next fixation

navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false })
  .then((media) => { $("video").srcObject = media; $("video").onloadeddata = () => { sendFrame(); sendFrame(); }; })
  .catch((error) => { $("status").textContent = `camera error: ${error.message}`; });
</script>
</body>
</html>
